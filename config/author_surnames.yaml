  # --- Author-block apostrophe normalisation (docs 3.13)
  #     The author block is a KEY and uses U+0027; these five carry U+2019.
  #     Measured: the authorities this library matches against are 99.95%
  #     U+0027 across 1,909 name records. Nothing else about these names
  #     changes -- in particular the transliteration of the two Slavic
  #     ones is NOT touched (Prats'ovytyi keeps its own final letter).
