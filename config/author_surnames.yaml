# Author surname authority — capitalisation of name particles.
#
# THE RULE: capitalise the particle when it is PART OF THE SURNAME, keep it
# lower case when it is a PREPOSITION. The test is whether it can be dropped:
# Alexis de Tocqueville is "Tocqueville" (preposition, lower case), but
# Jean-François Le Gall is never "Gall" (article, capital).
#
# So this file does NOT list every particle name — only the ones that take a
# capital. French "de/d'", German "von", Netherlands Dutch "van/de", and
# Portuguese/Spanish "de/da/dos" are prepositions and are already correct in
# lower case; they are deliberately absent. Chicago 14.21 keeps a lower-case
# particle lower case in an inverted entry (its own example: "du Maurier,
# Daphne."), and the Library of Congress files those names under the root.
#
# Researched 2026-09-03 against the LC name authority file, RDA/LC-PCC,
# Chicago 8.5/8.7-8.11/14.21/16.71, the Imprimerie nationale via Lacroux,
# the Accademia della Crusca, Taalunie/Onze Taal, zbMATH and arXiv.
# Every entry below was checked per person, not derived from its particle:
# nationality is NOT recoverable from the particle ("da Prato" is Italian and
# takes a capital; "da Silva" is Portuguese and does not).
#
# Two proposed changes were REFUTED by adversarial re-checking and are
# deliberately absent — in both the researcher had found the wrong person:
#   de Feo   — all 10 files are Filippo de Feo, who publishes lower case
#   de Vries — the claim was about Gustav de Vries (of KdV); the files are
#              Casper and Martijn de Vries
#
# Keys are case-folded; matching is case-insensitive and NFC-normalised.
# Applies to the AUTHOR BLOCK ONLY — never to a title.

