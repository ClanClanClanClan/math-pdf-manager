# TOMBSTONE. This is not the gate. The gate is .githooks/.
# ---------------------------------------------------------------------------
# What used to be here was 14 remote repos and 10 local hooks, and it had
# never run once. Two independent reasons, both verified 2026-08-20:
#
#   1. It cannot be installed. `git config core.hooksPath` is set to
#      `.githooks` (by scripts/install_hooks.sh), and the framework
#      refuses to install alongside it:
#
#          $ pre-commit install
#          [ERROR] Cowardly refusing to install hooks with
#                  `core.hooksPath` set.
#
#   2. Even run by hand, 8 of its 10 local hooks pointed at files that do
#      not exist in this repo — automated_improvement_tooling.py,
#      tools/file_size_check.py, tools/forbidden_pattern_check.py,
#      tools/single_responsibility_check.py, tools/dependency_rule_check.py,
#      tools/secure_config_check.py, and `python -m
#      Scripts.utils.check_regex_safety`; `validate-config` guarded a
#      config.yaml that is also absent. Measured:
#
#          $ pre-commit run architectural-lint --all-files
#          Architectural Linter ............................... Failed
#          can't open file 'automated_improvement_tooling.py'
#
#      The two hooks that would have run (pygrep for `print(` and for
#      `TODO:`) fail on nearly every file in src/, so they could never
#      have been passing either.
#
# A config listing 24 checks, none of which execute, is a claim about
# what this repo enforces. It was false, and it was the most visible
# statement of policy in the tree. That is the same defect the audits
# keep finding in the tests: something that reports green without
# looking.
#
# THE REAL GATE
# ---------------------------------------------------------------------------
#   .githooks/pre-commit   ~4s   safety-critical tests + golden corpus
#   .githooks/pre-push     ~77s  full suite
#   .github/workflows/ci.yml     full suite + coverage ratchet + corpus
#   Activate with:  scripts/install_hooks.sh
#
#   scripts/coverage_ratchet.py --check   coverage floors + the per-file
#                                         minimum for modules that can
#                                         move or delete a paper
#   scripts/check_test_quality.py         tests that cannot fail
#
# This file is kept, rather than deleted, so that anyone who reaches for
# `pre-commit` is redirected instead of finding nothing. It deliberately
# contains no passing hook: an uninstallable config must never be able to
# print a green line.
repos:
  - repo: local
    hooks:
      - id: wrong-gate
        name: "pre-commit is not this repo's gate (see .githooks/)"
        language: system
        always_run: true
        pass_filenames: false
        entry: >-
          bash -c 'echo; echo "This repo does not use the pre-commit
          framework: core.hooksPath is set to .githooks, so pre-commit
          cannot install itself."; echo "Run scripts/install_hooks.sh,
          then commit normally."; echo "Checks:  .githooks/pre-commit,
          .githooks/pre-push, scripts/coverage_ratchet.py --check,
          scripts/check_test_quality.py"; echo; exit 1'
